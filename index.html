const $=s=>document.querySelector(s), SIZE=20;
let state=JSON.parse(localStorage.getItem('deDeclStateV2')||'{}');
Object.assign(state,{score:state.score||0,answered:state.answered||0,streak:state.streak||0,best:state.best||0,phase:state.phase||'balanced',cycle:state.cycle||1,baseline:state.baseline||{},queue:state.queue||[],qIndex:state.qIndex||0,variant:state.variant||'Alle'});
let current=null,checked=false;
const norm=s=>(s||'').trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' '), key=x=>[x.type,x.adj,x.nounEnding?'Nomenendung':'ohne Nomenendung'].join('|');
function save(){localStorage.setItem('deDeclStateV2',JSON.stringify(state))}
function htmlEsc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function sourcePool(){return BANK.filter(x=>state.variant==='Alle'||x.variant===state.variant)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uniquePick(groups,n,used=new Set()){let out=[],keys=shuffle([...groups.keys()]);while(out.length<n&&keys.length){let progressed=false;for(const k of [...keys]){let arr=groups.get(k).filter(x=>!used.has(x.id+'-'+x.variant));if(arr.length){let x=arr[Math.floor(Math.random()*arr.length)];out.push(x);used.add(x.id+'-'+x.variant);progressed=true;if(out.length===n)break}else keys=keys.filter(z=>z!==k)}if(!progressed)break}return out}
function makeBalanced(){let p=sourcePool(),groups=new Map();for(const x of p){let k=key(x);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}let q=uniquePick(groups,SIZE);return shuffle(q)}
function weakKeys(){let entries=Object.entries(state.baseline).filter(([,v])=>v.seen>0&&v.wrong>0);if(!entries.length)return [];let max=Math.max(...entries.map(([,v])=>v.wrong/v.seen));return entries.filter(([,v])=>v.wrong/v.seen===max).map(([k])=>k)}
function makeFocused(){let p=sourcePool(),wk=new Set(weakKeys());if(!wk.size)return makeBalanced();let focused=new Map(),rest=new Map();for(const x of p){let dest=wk.has(key(x))?focused:rest,k=key(x);if(!dest.has(k))dest.set(k,[]);dest.get(k).push(x)}let used=new Set(),a=uniquePick(focused,14,used),b=uniquePick(rest,6,used);if(a.length<14)b=b.concat(uniquePick(rest,20-a.length-b.length,used));if(b.length<6)a=a.concat(uniquePick(focused,20-a.length-b.length,used));return shuffle(a.concat(b)).slice(0,SIZE)}
function ensureQueue(){if(!state.queue.length||state.qIndex>=state.queue.length){state.queue=(state.phase==='balanced'?makeBalanced():makeFocused()).map(x=>x.id+'-'+x.variant);state.qIndex=0;save()}}
function itemFromToken(t){let [id,...v]=t.split('-');return BANK.find(x=>String(x.id)===id&&x.variant===v.join('-'))}
function sentenceHtml(x,answers=false){let a=answers?(x.article?htmlEsc(x.article):''):('<span class="blank">'+(x.article?'Artikel':'∅')+'</span>');let ad=answers?htmlEsc(x.stem+x.adj):(htmlEsc(x.stem)+'<span class="blank">__</span>');let n=answers?htmlEsc(x.noun+x.nounEnding):(htmlEsc(x.noun)+(x.nounEnding?'<span class="blank">__</span>':''));return `${htmlEsc(x.context)} ${a} ${ad} ${n} ${htmlEsc(x.rest)}`.replace(/\s+([.,!?;:])/g,'$1')}
function renderStats(){$('#score').textContent=`${state.score}/${state.answered}`;$('#streak').textContent=state.streak;$('#best').textContent=state.best;$('#progress').style.width=(state.qIndex/SIZE*100)+'%';$('#roundName').textContent=state.phase==='balanced'?'Ausgewogene Runde':'Fokusrunde';$('#roundPurpose').textContent=state.phase==='balanced'?'Gleichmäßig verteilt':'70 % Schwächen · 30 % übrige Bereiche';$('#roundCount').textContent=Math.min(state.qIndex+1,SIZE)+' / '+SIZE}
function showQuestion(){ensureQueue();current=itemFromToken(state.queue[state.qIndex]);if(!current){state.queue=[];ensureQueue();current=itemFromToken(state.queue[state.qIndex])}checked=false;$('#quizArea').style.display='block';$('#complete').className='complete';$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#sentence').innerHTML=sentenceHtml(current);$('#typeTag').textContent=current.type;$('#variantTag').textContent='Variante '+current.variant;$('#roundTag').textContent='Runde '+current.round;$('#article').value='';$('#adj').value='';$('#nounEnding').value='';$('#articleField').classList.toggle('hide',!current.article);$('#nounField').classList.toggle('hide',!current.nounEnding);$('#articleHint').textContent=current.articleHint||'kein Artikel';$('#check').textContent='Prüfen';renderStats();setTimeout(()=>$('#'+(current.article?'article':'adj')).focus(),80)}
function finishRound(){$('#quizArea').style.display='none';$('#complete').className='complete show';if(state.phase==='balanced'){let weak=weakKeys();$('#completeTitle').textContent='Basisrunde geschafft';$('#completeText').textContent=weak.length?'Die nächste Runde konzentriert sich auf die Bereiche, die dir in dieser Basisrunde am schwersten fielen, mit einigen gleichmäßig verteilten Kontrollfragen.':'Keine Schwäche erkannt. Die nächste Runde bleibt ausgewogen.'}else{$('#completeTitle').textContent='Fokusrunde geschafft';$('#completeText').textContent='Jetzt folgt wieder eine neue, gleichmäßig verteilte Basisrunde. Deine Schwächen werden dabei neu bestimmt.'}}

function nextRound(){if(state.phase==='balanced'&&weakKeys().length)state.phase='focused';else{state.phase='balanced';state.cycle++;state.baseline={}}state.queue=[];state.qIndex=0;save();showQuestion()}
$('#check').onclick=check;$('#skip').onclick=advance;['article','adj','nounEnding'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')check()}));$('#startNext').onclick=nextRound;$('#variantFilter').value=state.variant;$('#variantFilter').onchange=e=>{state.variant=e.target.value;state.phase='balanced';state.baseline={};state.queue=[];state.qIndex=0;save();showQuestion()};$('#restart').onclick=()=>{state.phase='balanced';state.baseline={};state.queue=[];state.qIndex=0;save();showQuestion()};$('#reset').onclick=()=>{localStorage.removeItem('deDeclStateV2');location.reload()};
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));if(state.qIndex>=SIZE)finishRound();else showQuestion();</script></body></html>
